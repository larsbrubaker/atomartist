[package]
name = "atomartist-renderer"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "AtomArtist 3D viewport renderer (wgpu) — orbit camera, Blinn-Phong shading, gizmos."
repository = "https://github.com/larsbrubaker/atomartist"

[lib]
name = "atomartist_renderer"
path = "src/lib.rs"

[dependencies]
agg-gui        = { path = "../../agg-gui/agg-gui", default-features = false }
atomartist-lib = { path = "../atomartist-lib" }
demo-wgpu      = { path = "../../agg-gui/demo-wgpu", default-features = false }
manifold-rust  = { path = "../../manifold-rust" }
# Polygon tessellation for the rotate-gizmo arrow icon — the same
# sibling crate `atomartist-lib`'s Extrude node uses. Triangulates the
# MatterCAD rotation-arrow contour into the gizmo's flat handle plate.
tess2-rust     = { path = "../../tess2-rust" }
wgpu           = { version = "29", default-features = false, features = ["wgsl"] }
bytemuck       = { version = "1", features = ["derive"] }
glam           = { workspace = true }
web-time       = "1"
# Fast, non-cryptographic hashing for the render-mode edge topology
# pass (feature / non-manifold classification). The mesh is
# split-vertex so edges are keyed by position bits; std's SipHash makes
# that ~4× slower than it needs to be on dense meshes rebuilt per eval.
rustc-hash     = "2"

[dev-dependencies]
pollster       = "0.3"
# Direct naga dep with `wgsl-in` + `glsl-out` reachable from tests so
# `glsl_es_emit_succeeds` can catch WebGL2-incompatible shader
# constructs (depth-texture sampling, `textureLoad` on shadow samplers,
# etc.) at unit-test time without spinning up a real GL context.
naga           = { version = "29", features = ["wgsl-in", "glsl-out"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
version = "29"
default-features = false
features = ["wgsl", "vulkan", "dx12", "metal"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "29"
default-features = false
features = ["wgsl", "webgl"]
