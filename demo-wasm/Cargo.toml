[package]
name = "demo-wasm"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "AtomArtist WASM shell — wasm-bindgen entry, browser window/canvas glue."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agg-gui                  = { path = "../../agg-gui/agg-gui", default-features = false }
atomartist-lib           = { path = "../atomartist-lib" }
atomartist-renderer      = { path = "../atomartist-renderer" }
atomartist-storage       = { path = "../atomartist-storage" }
atomartist-ui            = { path = "../atomartist-ui" }
demo-wgpu                = { path = "../../agg-gui/demo-wgpu", default-features = false }
wasm-bindgen             = "0.2"
# Frame-cost measurement in `render` — `Instant` backed by
# `performance.now()` on wasm, so the Performance graph plots the same
# quantity the native shell does.
web-time                 = "1"
wasm-bindgen-futures     = "0.4"
js-sys                   = "0.3"
console_error_panic_hook = "0.1"

# `webgpu` (not `webgl`): the scene renderer's opaque pass needs
# per-target blend/write-mask states (INDEPENDENT_BLEND), which the
# WebGL2 backend cannot express — it panics creating the scene
# pipeline. Browser WebGPU supports the full feature set.
[dependencies.wgpu]
version = "29"
default-features = false
features = ["wgsl", "webgpu"]

[dependencies.web-sys]
version  = "0.3"
# `Storage` powers `web_settings`: UI settings live in localStorage, the
# browser counterpart to demo-native's settings.txt. `EventTarget` /
# `Event` / `MouseEvent` power `web_lifecycle`'s window-level listeners
# (mouse-release resync, visibilitychange/pagehide flush) — the pure-Rust
# alternative to adding more glue to index.html.
features = [
    "Window", "Document", "Element", "Node", "HtmlCanvasElement",
    "console", "Location", "Storage",
    "EventTarget", "Event", "MouseEvent",
    # `MouseEventInit` is only needed by `tests/web_lifecycle.rs`, which
    # dispatches a synthetic `pointerup` at the window listener; web-sys
    # features are crate-wide, so it can't be scoped to dev-dependencies.
    "MouseEventInit",
]

# `tests/web_settings.rs` needs a real browser (localStorage is a browser
# API), so it is a wasm-only target — see the file header for how to run it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
