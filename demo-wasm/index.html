<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AtomArtist</title>
<!-- Inline SVG favicon (an atom glyph) — silences the /favicon.ico 404
     on GitHub Pages without shipping a binary asset. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%234a90d9' stroke-width='2'%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' transform='rotate(120 16 16)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3' fill='%234a90d9'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #status {
    position: fixed;
    top: 8px; left: 8px;
    font-size: 11px;
    color: #888;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas" width="1280" height="720"></canvas>
<div id="status">Loading...</div>
<script type="module">
import init, {
  render,
  on_mouse_move,
  on_mouse_leave,
  on_mouse_down,
  on_mouse_up,
  on_mouse_wheel,
} from './pkg/demo_wasm.js';

async function main() {
  await init();
  document.getElementById('status').textContent = '';

  const canvas = document.getElementById('canvas');
  // Keep the canvas backing store matched to its on-screen size (in
  // device pixels) so rendering is 1:1 with the page and never stretched.
  // This is synced every frame from `loop` rather than once at startup:
  // a one-shot resize raced with the async wgpu init and left the canvas
  // pinned at its initial 1280x720 attribute size, which CSS then
  // stretched to fill the window. Assigning canvas.width/height clears
  // the drawing buffer, so only write when the target actually changes.
  function syncCanvasSize() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(canvas.clientWidth  * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  syncCanvasSize();

  // Translate browser mouse coords (top-left origin, CSS pixels) into
  // physical-pixel coords matching what the agg-gui App expects on
  // native (raw winit position). Multiply by devicePixelRatio so 1
  // CSS pixel = 1 logical pixel on the canvas, accounting for HiDPI.
  function evtCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    return [(e.clientX - rect.left) * dpr, (e.clientY - rect.top) * dpr];
  }
  canvas.addEventListener('mousemove', e => {
    const [x, y] = evtCoords(e);
    // `e.buttons` is the authoritative held-button bitmask; Rust uses it
    // to re-sync its own press counter, which would otherwise stay stuck
    // after a drag released outside the canvas.
    on_mouse_move(x, y, e.buttons);
  });
  // The pointer left the canvas: no further `mousemove` arrives, so
  // hover state has to be cleared explicitly or a latched highlight (and
  // its tooltip) sticks. `mouseleave`, not `mouseout` — the latter also
  // fires when moving onto a child element.
  canvas.addEventListener('mouseleave', () => {
    on_mouse_leave();
  });
  // Modifier flags ride along with every button/wheel event. They come
  // from the event itself (not tracked key state) so they stay correct
  // when the page loses focus mid-drag. Ctrl/Shift+click multi-select and
  // Ctrl+wheel zoom were dead on web without these.
  const mods = e => [e.ctrlKey, e.shiftKey, e.altKey, e.metaKey];
  canvas.addEventListener('mousedown', e => {
    const [x, y] = evtCoords(e);
    on_mouse_down(x, y, e.button, ...mods(e));
  });
  canvas.addEventListener('mouseup', e => {
    const [x, y] = evtCoords(e);
    on_mouse_up(x, y, e.button, ...mods(e));
  });
  // Wheel-delta normalisation. A port of `agg_gui::wheel`
  // (agg-gui/src/wheel.rs), which is the source of truth and carries the
  // unit tests — this glue calls the wasm export directly instead of
  // going through agg-gui's own `web_shell`, so the small pure function
  // is duplicated here. Keep the two in step.
  //
  // agg-gui's delta is in *notches*, not pixels: every consumer scales it
  // itself (ScrollView 40 px, favorites strip 40 px, browser grid
  // GRID_SCROLL_STEP), and zoom consumers read only the sign. Browsers
  // report CSS pixels (deltaMode 0), lines (1) or pages (2). Passing raw
  // pixels made every scroll ~100x too far (design §5c, step 6g-2).
  const PIXELS_PER_NOTCH = 40, NOTCHES_PER_PAGE = 8, NOTCH_EPSILON = 1e-9;
  const wheelAcc = { x: 0, y: 0 };
  function toNotches(delta, deltaMode) {
    if (!Number.isFinite(delta)) return 0;
    if (deltaMode === 1) return delta;                 // lines: 1 = 1 notch
    if (deltaMode === 2) return delta * NOTCHES_PER_PAGE;
    return delta / PIXELS_PER_NOTCH;                   // pixels
  }
  // Bank sub-notch travel (a trackpad sends 1-10 px per event) and emit
  // only whole notches, keeping the remainder: nothing is lost — 40 px of
  // finger is always exactly one notch — and no consumer ever sees a
  // fraction, which is what would make a sign-reading zoom jump per event.
  // A direction change drops the partial notch so a reversal answers at
  // once.
  function bank(axis, notches) {
    if (notches === 0) return 0;
    if (wheelAcc[axis] !== 0 && Math.sign(wheelAcc[axis]) !== Math.sign(notches)) {
      wheelAcc[axis] = 0;
    }
    wheelAcc[axis] += notches;
    const whole = Math.sign(wheelAcc[axis]) *
      Math.trunc(Math.abs(wheelAcc[axis]) + NOTCH_EPSILON);
    wheelAcc[axis] -= whole;
    return whole;
  }
  canvas.addEventListener('wheel', e => {
    const [x, y] = evtCoords(e);
    e.preventDefault();
    // -deltaY because browsers send positive deltaY when scrolling down
    // but agg-gui expects positive when scrolling up (zoom in).
    const dy = bank('y', toNotches(-e.deltaY, e.deltaMode));
    if (dy === 0) return;  // not yet a whole notch
    on_mouse_wheel(x, y, dy, ...mods(e));
  }, { passive: false });
  // Disable the right-click context menu so the canvas's own menu wins.
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // `render`'s third argument is the *interval* since the previous
  // tick, not the raw requestAnimationFrame timestamp. Passing `t`
  // directly made the Performance window read milliseconds-since-page-
  // load, which climbs forever and looked like a six-figure frame time.
  let lastFrameTime = null;
  function loop(t) {
    const deltaMs = lastFrameTime === null ? 0 : t - lastFrameTime;
    lastFrameTime = t;
    syncCanvasSize();
    render(canvas.width, canvas.height, deltaMs);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
main().catch(err => {
  document.getElementById('status').textContent = 'Failed to load: ' + err;
  console.error(err);
});
</script>
</body>
</html>
