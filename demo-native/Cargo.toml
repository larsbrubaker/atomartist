[package]
name = "demo-native"
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "AtomArtist native shell — agg-gui-shell window/event loop plus app-specific host glue."

[[bin]]
name = "atomartist"
path = "src/main.rs"

[dependencies]
agg-gui             = { path = "../../agg-gui/agg-gui", default-features = false, features = ["winit-adapter"] }
# The shell re-exports `winit` and `wgpu`, so this crate reaches both through
# `agg_gui_shell::{winit, wgpu}` and the majors can never disagree.
agg-gui-shell       = { path = "../../agg-gui/agg-gui-shell" }
agg-gui-wgpu        = { path = "../../agg-gui/agg-gui-wgpu", default-features = false }
atomartist-lib      = { path = "../atomartist-lib" }
atomartist-storage  = { path = "../atomartist-storage" }
atomartist-renderer = { path = "../atomartist-renderer" }
atomartist-ui       = { path = "../atomartist-ui" }
rfd                 = "0.15"
web-time            = "1"

[dependencies.wgpu]
version = "29"
default-features = false
features = ["wgsl", "vulkan", "dx12", "metal"]
