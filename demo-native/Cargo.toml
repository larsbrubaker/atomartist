[package]
name = "demo-native"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "AtomArtist native shell — winit + wgpu window, event loop, disk persistence."

[[bin]]
name = "atomartist"
path = "src/main.rs"

[dependencies]
agg-gui             = { path = "../../agg-gui/agg-gui", default-features = false, features = ["winit-adapter"] }
atomartist-lib      = { path = "../atomartist-lib" }
atomartist-storage  = { path = "../atomartist-storage" }
atomartist-renderer = { path = "../atomartist-renderer" }
atomartist-ui       = { path = "../atomartist-ui" }
demo-wgpu           = { path = "../../agg-gui/demo-wgpu", default-features = false }
winit               = "0.30"
pollster            = "0.4"
raw-window-handle   = "0.6"
image               = { version = "0.24", default-features = false, features = ["png"] }
rfd                 = "0.15"
web-time            = "1"

# Drop-position workaround: winit's Windows backend performs OLE
# drag-and-drop without emitting CursorMoved (and discards the drop
# point), so we query the live cursor at DroppedFile time. Same
# windows-sys version winit already pulls in — no extra build cost.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dependencies.wgpu]
version = "29"
default-features = false
features = ["wgsl", "vulkan", "dx12", "metal"]
