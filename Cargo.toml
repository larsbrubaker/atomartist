[workspace]
members = [
    "atomartist-lib",
    "atomartist-renderer",
    "atomartist-storage",
    "atomartist-ui",
    "atomartist-ui-test",
    "demo-native",
    "demo-wasm",
]
default-members = [
    "atomartist-lib",
    "atomartist-ui",
    "demo-native",
]
resolver = "2"

# Shared third-party deps — declared at the workspace level so every
# crate that needs them resolves to the same version.
[workspace.dependencies]
# `glam` for 3-D linear algebra. Picked for its small footprint, fast
# wasm builds, and `wgpu`-friendly `Mat4::to_cols_array` interop. We
# do NOT enable `bytemuck` / `serde` features by default — opt in
# per-crate if they are ever needed.
glam = { version = "0.30", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Debug-build optimization. BOTH sections below are required — do not "simplify"
# by deleting either one.
#
# `[profile.dev.package."*"]` applies to DEPENDENCIES ONLY; Cargo does not apply
# it to workspace members. But generic and `#[inline]` code from agg-gui and wgpu
# is monomorphized into the *calling* crate, so those instantiations are codegen'd
# inside our workspace members and inherit the member's opt-level. With the member
# opt-level left at 0, the dependency override is silently defeated in exactly the
# hottest code path.
#
# Measured: the wgpu render-pass walk in `WgpuGfxCtx::end_frame` ran 118 ms/frame
# with only the `package."*"` override, and 3.7 ms/frame once workspace members
# also got an opt-level — total frame time 120-200 ms down to ~11 ms, i.e. release
# parity. `debug-assertions` and debuginfo are untouched, so assertions and
# backtraces still work.
#
# opt-level 1 (not 2) for workspace members is a deliberate balance: it recovers
# essentially all of the runtime win while keeping incremental compiles fast,
# since member crates are the ones we recompile constantly.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# ---------------------------------------------------------------------------
# Local sibling-submodule path overrides
# ---------------------------------------------------------------------------
# AtomArtist depends on agg-gui, manifold-rust, clipper2-rust, tess2-rust as
# sibling submodules in the rust-apps directory while we develop them in
# tandem. To switch to published crates, comment out this section.
#
# [patch.crates-io]
# agg-gui       = { path = "../agg-gui/agg-gui" }
# manifold-rust = { path = "../manifold-rust" }
# clipper2-rust = { path = "../clipper2-rust" }
# tess2-rust    = { path = "../tess2-rust" }
